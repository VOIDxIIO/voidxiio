<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" xmlns:c2pa="http://c2pa.org/manifest">
<style>text{font-family:'Courier New',Consolas,Menlo,monospace;fill:#f2f2f2;font-size:15px}.d{fill:#8a8a8a}</style>
<rect width="800" height="250" rx="10" fill="#000"/>
<rect width="800" height="30" rx="10" fill="#111"/><rect y="18" width="800" height="12" fill="#111"/>
<circle cx="20" cy="15" r="5" fill="#fff"/><circle cx="38" cy="15" r="5" fill="#666"/><circle cx="56" cy="15" r="5" fill="#333"/>
<text x="30" y="68" opacity="0">$ ./boot --profile<set attributeName="opacity" to="1" begin="0.3s"/></text>
<g opacity="0"><set attributeName="opacity" to="1" begin="1s"/>
<text x="30" y="98" class="d">loading</text>
<rect x="100" y="85" width="300" height="14" fill="none" stroke="#fff"/>
<rect x="100" y="85" width="0" height="14" fill="#fff"><animate attributeName="width" from="0" to="300" begin="1s" dur="2s" fill="freeze"/></rect>
<text x="415" y="98" opacity="0">done<set attributeName="opacity" to="1" begin="3s"/></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.3s"/>
<clipPath id="c"><rect x="30" y="120" width="0" height="70"><animate attributeName="width" calcMode="discrete" values="0;27;54;80;107;134;160;187;214" begin="3.3s" dur="0.9s" fill="freeze"/></rect></clipPath>
<text x="30" y="168" clip-path="url(#c)" style="font-size:45px;font-weight:bold">voidxiio</text></g>
<text x="30" y="205" class="d" opacity="0">one line about what you build<set attributeName="opacity" to="1" begin="4.4s"/></text>
<text x="30" y="230" opacity="0">$ <tspan>█<animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/></tspan><set attributeName="opacity" to="1" begin="4.8s"/></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
