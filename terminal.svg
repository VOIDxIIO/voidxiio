<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Courier New', Consolas, monospace; font-size: 16px; fill: #f2f2f2; }
    .dim { fill: #8a8a8a; }
    .l { opacity: 0; animation: show 0.01s forwards; }
    @keyframes show { to { opacity: 1; } }
    .bar { width: 0; animation: fill 3s steps(30, end) 3.6s forwards; }
    @keyframes fill { to { width: 400px; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="800" height="400" rx="12" fill="#000"/>
  <rect width="800" height="34" rx="12" fill="#111"/>
  <rect y="20" width="800" height="14" fill="#111"/>
  <circle cx="22" cy="17" r="6" fill="#fff"/>
  <circle cx="44" cy="17" r="6" fill="#777"/>
  <circle cx="66" cy="17" r="6" fill="#333"/>
  <text x="330" y="22" class="dim" style="font-size:13px">voidxiio@void:~</text>

  <text x="30" y="70"  class="l" style="animation-delay:0.3s">$ boot voidxiio.sys</text>
  <text x="30" y="100" class="l dim" style="animation-delay:1.1s">[ ok ] loading vibes...</text>
  <text x="30" y="125" class="l dim" style="animation-delay:1.7s">[ ok ] mounting side projects</text>
  <text x="30" y="150" class="l dim" style="animation-delay:2.3s">[ ok ] caffeine.exe detected</text>
  <text x="30" y="175" class="l dim" style="animation-delay:2.9s">[ .. ] compiling brain</text>

  <text x="30" y="215" class="l" style="animation-delay:3.4s">loading</text>
