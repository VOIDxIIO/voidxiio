    <rect x="110" y="201" height="18" fill="#fff" class="bar"/>
  </g>
  <text x="525" y="215" class="l" style="animation-delay:6.6s">100%</text>

  <text x="30" y="260" class="l" style="animation-delay:7.0s">$ whoami</text>
  <text x="30" y="288" class="l" style="animation-delay:7.6s">voidxiio // vibe coder</text>
  <text x="30" y="313" class="l dim" style="animation-delay:8.2s">builds random stuff at 3am. ships when it works.</text>
  <text x="30" y="338" class="l dim" style="animation-delay:8.8s">status: side projects only. no deadlines. no stress.</text>

  <text x="30" y="372" class="l" style="animation-delay:9.4s">$ <tspan class="cur">█</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
